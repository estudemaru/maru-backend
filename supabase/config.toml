project_id = "qxtgaalmyzyldmcpwooo"

[functions.maru-api]
verify_jwt = false
entrypoint = "./functions/maru-api/bundle.js"

# Desired Auth settings. Remote application remains pending until authenticated.
[auth]
enabled = true
site_url = "https://estudemaru.com.br"
additional_redirect_urls = [
  "https://estudemaru.com.br",
  "https://estudemaru.com.br/api/auth/google/callback",
  "https://estudemaru.com.br/api/auth/discord/callback",
  "https://www.estudemaru.com.br",
  "https://www.estudemaru.com.br/api/auth/google/callback",
  "https://www.estudemaru.com.br/api/auth/discord/callback",
  "https://maru-frontend-murex.vercel.app",
  "https://maru-frontend-murex.vercel.app/api/auth/google/callback",
  "https://maru-frontend-murex.vercel.app/api/auth/discord/callback"
]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# A custom SMTP provider must be configured remotely before public signup.
# Do not store SMTP passwords in this file.
